anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#4ADE80">v2</text><text x="750" y="262" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Short ready in under 5 min.</text><text x="750" y="284" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Would pay? &quot;Probably yes.&quot;</text><path d="M420 170 H560" stroke="#FACC15" stroke-width="6" stroke-linecap="round"/><path d="M548 156 L568 170 L548 184" fill="none" stroke="#FACC15" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="316" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#9CA3AF">Source: ClipRadar internal user tests, 2026-10-14 (project not public)</text></svg>