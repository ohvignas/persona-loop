<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="The 6 agents">
<rect width="1200" height="420" rx="24" fill="#111827"/>
<text x="600" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F9FAFB">The 6 agents</text>
<rect x="40" y="80" width="360" height="145" rx="18" fill="#1F2937" stroke="#7C3AED" stroke-width="3"/>
<rect x="60" y="100" width="56" height="56" rx="14" fill="#7C3AED"/><g transform="translate(68,108) scale(1.65)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></g>
<text x="132" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">persona-architect</text>
<text x="62" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Builds a believable customer</text><text x="62" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">from your app and what you say.</text>
<rect x="420" y="80" width="360" height="145" rx="18" fill="#1F2937" stroke="#2563EB" stroke-width="3"/>
<rect x="440" y="100" width="56" height="56" rx="14" fill="#2563EB"/><g transform="translate(448,108) scale(1.65)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></g>
<text x="512" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">journey-mapper</text>
<text x="442" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Lists the steps that customer</text><text x="442" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">needs to reach their goal.</text>
<rect x="800" y="80" width="360" height="145" rx="18" fill="#1F2937" stroke="#0891B2" stroke-width="3"/>
<rect x="820" y="100" width="56" height="56" rx="14" fill="#0891B2"/><g transform="translate(828,108) scale(1.65)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20"/><circle cx="6" cy="6.5" r=".6"/></g>
<text x="892" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">persona-tester</text>
<text x="822" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Plays the persona in its own</text><text x="822" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">browser. Notes every frustration.</text>
<rect x="40" y="245" width="360" height="145" rx="18" fill="#1F2937" stroke="#DB2777" stroke-width="3"/>
<rect x="60" y="265" width="56" height="56" rx="14" fill="#DB2777"/><g transform="translate(68,273) scale(1.65)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
<text x="132" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">ux-critic</text>
<text x="62" y="353" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Reviews each screen: UX, mobile,</text><text x="62" y="375" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">accessibility. Proof for each point.</text>
<rect x="420" y="245" width="360" height="145" rx="18" fill="#1F2937" stroke="#D97706" stroke-width="3"/>
<rect x="440" y="265" width="56" height="56" rx="14" fill="#D97706"/><g transform="translate(448,273) scale(1.65)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.5l1.7-7.2L2 9.6 9 9z"/></g>
<text x="512" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">scorer</text>
<text x="442" y="353" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Grades 10 dimensions /10</text><text x="442" y="375" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">in a fresh context, with evidence.</text>
<rect x="800" y="245" width="360" height="145" rx="18" fill="#1F2937" stroke="#16A34A" stroke-width="3"/>
<rect x="820" y="265" width="56" height="56" rx="14" fill="#16A34A"/><g transform="translate(828,273) scale(1.65)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-2.6-2.4a4 4 0 0 0-5-5L4 12l8-8z"/></g>
<text x="892" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">fixer-planner</text>
<text x="822" y="353" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">Turns findings into a fix plan</text><text x="822" y="375" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#E5E7EB">you approve before any change.</text>
</svg>